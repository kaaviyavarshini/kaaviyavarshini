<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="360" height="520" viewBox="0 0 360 520" role="img" aria-label="MicroGrid Simulation">
  <defs>
    <filter id="shadow-microgrid" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <linearGradient id="sheen-microgrid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes sweepSheen {
        0% { transform: translateX(-150%) translateY(-150%); }
        40%, 100% { transform: translateX(150%) translateY(150%); }
      }
      .floating-card {
        animation: floatCard 5s ease-in-out infinite;
      }
      .sheen-layer {
        animation: sweepSheen 4.5s ease-in-out infinite;
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }
    </style>
  </defs>

  <g class="floating-card">
    <a xlink:href="https://github.com/kaaviyavarshini/microgrid_simulation" target="_blank">
      <!-- Background Card -->
      <rect x="10" y="10" width="340" height="500" rx="18" fill="#0D1527" stroke="#A78BFA" stroke-width="2" filter="url(#shadow-microgrid)" />
      
      <!-- Inner Frame -->
      <rect x="20" y="20" width="320" height="480" rx="12" fill="none" stroke="#A78BFA" stroke-width="1" opacity="0.35" />

      <!-- Top Metadata Header -->
      <text x="35" y="48" font-size="12" font-weight="900" fill="#A78BFA" class="mono">[ 03 // 03 ]</text>
      <rect x="220" y="34" width="105" height="20" rx="10" fill="#A78BFA" opacity="0.2" />
      <text x="272" y="48" font-size="10" font-weight="800" text-anchor="middle" fill="#A78BFA" class="mono">ZERO-BLACKOUT</text>

      <!-- Center Project Emblem / Artwork -->
      <g transform="translate(180, 135)">
        <circle cx="0" cy="0" r="54" fill="#050B14" stroke="#A78BFA" stroke-width="1.5" />
        <g><text x="0" y="8" font-size="24" font-weight="900" text-anchor="middle" fill="#F8FAFC" font-family="monospace">1:1</text><ellipse cx="0" cy="0" rx="36" ry="12" fill="none" stroke="#A78BFA" stroke-width="1.5" transform="rotate(25)" /></g>
      </g>

      <!-- Project Name -->
      <text x="35" y="230" font-size="20" font-weight="900" fill="#F8FAFC" letter-spacing="-0.5">MicroGrid Simulation</text>
      <text x="35" y="250" font-size="11" font-weight="800" fill="#A78BFA" class="mono">AUTONOMOUS ZERO-BLACKOUT ENERGY ENGINE</text>

      <!-- Description -->
      <text x="35" y="280" font-size="12" fill="#94A3B8">
        <tspan x="35" dy="0">Deterministic microgrid controller</tspan><tspan x="35" dy="18">guaranteeing 100% reliability for hospital</tspan><tspan x="35" dy="18">infrastructure using PuLP linear</tspan>
      </text>

      <!-- Tech Stack Badges -->
      <g transform="translate(35, 350)">
        
        <rect x="0" y="0" width="90" height="20" rx="4" fill="#0F172A" opacity="1" stroke="#334155" stroke-width="1" />
        <text x="45" y="14" font-size="9.5" font-weight="700" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, monospace">Python</text>
        
        <rect x="96" y="0" width="90" height="20" rx="4" fill="#0F172A" opacity="1" stroke="#334155" stroke-width="1" />
        <text x="141" y="14" font-size="9.5" font-weight="700" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, monospace">PuLP</text>
        
        <rect x="192" y="0" width="90" height="20" rx="4" fill="#0F172A" opacity="1" stroke="#334155" stroke-width="1" />
        <text x="237" y="14" font-size="9.5" font-weight="700" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, monospace">NumPy</text>
        
        <rect x="0" y="26" width="90" height="20" rx="4" fill="#0F172A" opacity="1" stroke="#334155" stroke-width="1" />
        <text x="45" y="40" font-size="9.5" font-weight="700" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, monospace">Pandas</text>
        
        <rect x="96" y="26" width="90" height="20" rx="4" fill="#0F172A" opacity="1" stroke="#334155" stroke-width="1" />
        <text x="141" y="40" font-size="9.5" font-weight="700" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, monospace">Matplotlib</text>
        
        <rect x="192" y="26" width="90" height="20" rx="4" fill="#0F172A" opacity="1" stroke="#334155" stroke-width="1" />
        <text x="237" y="40" font-size="9.5" font-weight="700" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, monospace">Streamlit</text>
        
      </g>

      <!-- Direct Repo Link Button -->
      <g transform="translate(35, 435)">
        <rect x="0" y="0" width="290" height="38" rx="8" fill="#A78BFA" opacity="0.2" stroke="#A78BFA" stroke-width="1.2" />
        <text x="145" y="24" font-size="12" font-weight="800" text-anchor="middle" fill="#A78BFA" class="mono">VIEW ON GITHUB ↗</text>
      </g>

      <!-- Shimmer sweep -->
      <rect x="10" y="10" width="340" height="500" rx="18" fill="url(#sheen-microgrid)" class="sheen-layer" pointer-events="none" />
    </a>
  </g>
</svg>