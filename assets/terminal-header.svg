<svg viewBox="0 0 850 360" width="850" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#070b12" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1b2d" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0b1320" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .title-text { font-size: 11px; fill: #38bdf8; font-weight: 600; letter-spacing: 0.5px; }
    .badge-text { font-size: 8.5px; fill: #38bdf8; font-weight: 700; letter-spacing: 1px; }
    .code-comment { font-size: 10px; fill: #64748b; font-style: italic; }
    .code-key { font-size: 10px; fill: #f43f5e; font-weight: 600; }
    .code-str { font-size: 10px; fill: #34d399; }
    .code-num { font-size: 10px; fill: #fbbf24; font-weight: 600; }
    .code-keyword { font-size: 10px; fill: #c084fc; font-weight: 600; }
    .code-bullet { font-size: 10px; fill: #38bdf8; }
    .spec-head { font-size: 10.5px; fill: #f8fafc; font-weight: 700; letter-spacing: 0.5px; }
    .spec-label { font-size: 9px; fill: #38bdf8; font-weight: 600; }
    .spec-val { font-size: 9px; fill: #cbd5e1; }
    .spec-item { font-size: 9px; fill: #94a3b8; }
    .spec-link { font-size: 9px; fill: #818cf8; font-weight: 500; }
    .radar-stat-lbl { font-size: 8.5px; fill: #64748b; font-weight: 600; }
    .radar-stat-val { font-size: 8.5px; fill: #38bdf8; font-weight: 700; }
  </style>

  <!-- Outer Window Background -->
  <rect x="2" y="2" width="846" height="356" rx="12" fill="url(#bgGrad)" stroke="#1e3a5f" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <path d="M 2 14 Q 2 2 14 2 L 836 2 Q 848 2 848 14 L 848 34 L 2 34 Z" fill="#0d1527" stroke="#1e293b" stroke-width="1" />
  
  <!-- Window Control Buttons -->
  <circle cx="20" cy="18" r="4.5" fill="#ef4444" />
  <circle cx="36" cy="18" r="4.5" fill="#f59e0b" />
  <circle cx="52" cy="18" r="4.5" fill="#10b981" />

  <!-- Window Title -->
  <text class="mono title-text" x="425" y="22" text-anchor="middle">kaaviyavarshini / README.md</text>

  <!-- Status indicator -->
  <circle cx="788" cy="18" r="3.5" fill="#10b981" filter="url(#subtleGlow)" />
  <text class="mono" x="797" y="21.5" font-size="8.5" fill="#94a3b8" font-weight="600" letter-spacing="0.5">ONLINE</text>

  <!-- ================= PANEL 1: RADAR / GEO ================= -->
  <rect x="18" y="48" width="225" height="294" rx="8" fill="url(#panelGrad)" stroke="#1e293b" stroke-width="1" />
  <!-- Panel Badge -->
  <rect x="30" y="41" width="94" height="14" rx="3" fill="#090d16" stroke="#1e3a5f" stroke-width="1" />
  <text class="mono badge-text" x="77" y="51.5" text-anchor="middle">VISUAL_RADAR</text>

  <!-- Radar Grid -->
