    <!-- Concentric Rings -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-dasharray="3 3" />
    <circle cx="0" cy="0" r="38" fill="none" stroke="#38bdf8" stroke-opacity="0.45" />
    <circle cx="0" cy="0" r="22" fill="none" stroke="#38bdf8" stroke-opacity="0.6" />
    <circle cx="0" cy="0" r="7" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2" filter="url(#subtleGlow)" />
    <!-- Axes -->
    <line x1="-54" y1="0" x2="54" y2="0" stroke="#38bdf8" stroke-opacity="0.25" />
    <line x1="0" y1="-54" x2="0" y2="54" stroke="#38bdf8" stroke-opacity="0.25" />
    <!-- Radar Sweep Beam (decorative) -->
    <line x1="0" y1="0" x2="38" y2="-38" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" filter="url(#subtleGlow)" />
    <polygon points="0,0 38,-38 48,-20" fill="#38bdf8" fill-opacity="0.15" />
    <!-- Blip nodes -->
    <circle cx="24" cy="-18" r="2.5" fill="#34d399" filter="url(#subtleGlow)" />
    <circle cx="-28" cy="22" r="2" fill="#f43f5e" />
    <circle cx="15" cy="32" r="2" fill="#38bdf8" />
  </g>

  <!-- Radar Metrics Text -->
  <g class="mono" transform="translate(32, 222)">
    <text y="0" class="radar-stat-lbl">LOC: <tspan class="radar-stat-val">CHENNAI, IN [13.08°N]</tspan></text>
    <text y="18" class="radar-stat-lbl">CORE: <tspan class="radar-stat-val">AGENTIC_AI_v2.6</tspan></text>
    <text y="36" class="radar-stat-lbl">DOMAIN: <tspan class="radar-stat-val">GENAI • ML • SYSTEMS</tspan></text>
    <text y="54" class="radar-stat-lbl">NETWORK: <tspan fill="#10b981" font-weight="700">CONNECTED / 99.9%</tspan></text>
    <text y="72" class="radar-stat-lbl">MODE: <tspan fill="#c084fc" font-weight="700">AUTONOMOUS DISPATCH</tspan></text>
  </g>

  <!-- ================= PANEL 2: PROFILE YAML ================= -->
  <rect x="255" y="48" width="345" height="294" rx="8" fill="url(#panelGrad)" stroke="#1e293b" stroke-width="1" />
  <!-- Panel Badge -->
  <rect x="268" y="41" width="86" height="14" rx="3" fill="#090d16" stroke="#1e3a5f" stroke-width="1" />
  <text class="mono badge-text" x="311" y="51.5" text-anchor="middle">profile.yaml</text>

  <!-- Code text -->
  <g class="mono" transform="translate(272, 75)">
    <text y="0" class="code-comment"># Developer &amp; Autonomous AI Architect</text>
    
    <text y="22"><tspan class="code-key">name</tspan>: <tspan class="code-str">"V Kaaviya Varshini"</tspan></text>
    <text y="42"><tspan class="code-key">role</tspan>: <tspan class="code-str">"AI Engineer &amp; Researcher"</tspan></text>
    <text y="62"><tspan class="code-key">campus</tspan>: <tspan class="code-str">"SRM IST, Chennai"</tspan></text>
    <text y="82"><tspan class="code-key">cgpa</tspan>: <tspan class="code-num">9.88</tspan> <tspan class="code-comment"># AI &amp; CSE Spec</tspan></text>
    
    <text y="104"><tspan class="code-key">specializations</tspan>:</text>
    <text y="122">  <tspan class="code-bullet">▸</tspan> <tspan class="code-str">"Multi-Agent Workflow Systems"</tspan></text>
    <text y="140">  <tspan class="code-bullet">▸</tspan> <tspan class="code-str">"Autonomous Security &amp; LLMs"</tspan></text>
    <text y="158">  <tspan class="code-bullet">▸</tspan> <tspan class="code-str">"Deterministic Safety Engines"</tspan></text>
    <text y="176">  <tspan class="code-bullet">▸</tspan> <tspan class="code-str">"Enterprise RAG Pipelines"</tspan></text>
    
    <text y="198"><tspan class="code-key">orchestration</tspan>:</text>
    <text y="216">  <tspan class="code-bullet">▸</tspan> <tspan class="code-keyword">LangGraph</tspan> • <tspan class="code-keyword">LangChain</tspan> • <tspan class="code-keyword">Bedrock</tspan></text>
    
    <text y="238"><tspan class="code-key">status</tspan>: <tspan class="code-str">"Building, Learning &amp; Shipping ⚡"</tspan></text>
  </g>

  <!-- ================= PANEL 3: SYSTEM SPEC ================= -->
  <rect x="612" y="48" width="220" height="294" rx="8" fill="url(#panelGrad)" stroke="#1e293b" stroke-width="1" />
  <!-- Panel Badge -->
  <rect x="624" y="41" width="88" height="14" rx="3" fill="#090d16" stroke="#1e3a5f" stroke-width="1" />
  <text class="mono badge-text" x="668" y="51.5" text-anchor="middle">system.spec</text>

  <!-- Spec text -->
  <g class="mono" transform="translate(626, 75)">
    <text y="0" class="spec-head">AI ENGINEER &amp; LEAD</text>
    <text y="18" class="spec-val"><tspan class="spec-label">Domain:</tspan> Agentic AI &amp; LLMs</text>
    <text y="34" class="spec-val"><tspan class="spec-label">Base:</tspan> Chennai, India 🇮🇳</text>
    <text y="50" class="spec-val"><tspan class="spec-label">Motto:</tspan> Ship with Precision</text>

    <!-- Divider -->
    <line x1="0" y1="62" x2="192" y2="62" stroke="#1e293b" stroke-dasharray="3 3" />

    <text y="78" class="spec-head" font-size="9.5">CORE ECOSYSTEM:</text>
    <text y="96" class="spec-item"><tspan fill="#38bdf8">▸</tspan> Python • FastAPI • Flask</text>
    <text y="112" class="spec-item"><tspan fill="#38bdf8">▸</tspan> Next.js 16 • React 19</text>
    <text y="128" class="spec-item"><tspan fill="#38bdf8">▸</tspan> Gemma-3 • Llama-2 • Gemini</text>
    <text y="144" class="spec-item"><tspan fill="#38bdf8">▸</tspan> Docker • K8s • Bedrock</text>
    <text y="160" class="spec-item"><tspan fill="#38bdf8">▸</tspan> Pinecone • Postgres • SQLite</text>

    <!-- Divider -->
    <line x1="0" y1="172" x2="192" y2="172" stroke="#1e293b" stroke-dasharray="3 3" />

    <text y="188" class="spec-head" font-size="9.5">CHANNELS:</text>
    <text y="206" class="spec-link">🔗 /kaaviyavarshini</text>
    <text y="222" class="spec-link">💼 /in/kaaviyavarshini</text>
    <text y="238" class="spec-link" font-size="8.5">✉️ kaavi7ya@email.com</text>
  </g>
</svg>
