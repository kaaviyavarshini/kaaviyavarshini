<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="360" height="520" viewBox="0 0 360 520" role="img" aria-label="SIH InThack">
  <defs>
    <filter id="shadow-sih-inthack" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <linearGradient id="sheen-sih-inthack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes sweepSheen {
        0% { transform: translateX(-150%) translateY(-150%); }
        40%, 100% { transform: translateX(150%) translateY(150%); }
      }
      .floating-card {
        animation: floatCard 5s ease-in-out infinite;
      }
      .sheen-layer {
        animation: sweepSheen 4.5s ease-in-out infinite;
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }
    </style>
  </defs>

  <g class="floating-card">
    <a xlink:href="https://github.com/kaaviyavarshini/sih-inthack" target="_blank">
      <!-- Background Card -->
      <rect x="10" y="10" width="340" height="500" rx="18" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2" filter="url(#shadow-sih-inthack)" />
      
      <!-- Inner Frame -->
      <rect x="20" y="20" width="320" height="480" rx="12" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.35" />

      <!-- Top Metadata Header -->
      <text x="35" y="48" font-size="12" font-weight="900" fill="#38BDF8" class="mono">[ 01 // 03 ]</text>
      <rect x="220" y="34" width="105" height="20" rx="10" fill="#38BDF8" opacity="0.2" />
      <text x="272" y="48" font-size="10" font-weight="800" text-anchor="middle" fill="#38BDF8" class="mono">SIH '25 WINNER</text>

      <!-- Center Project Emblem / Artwork -->
      <g transform="translate(180, 135)">
        <circle cx="0" cy="0" r="54" fill="#050B14" stroke="#38BDF8" stroke-width="1.5" />
        <g><circle cx="0" cy="0" r="32" fill="#0284C7" opacity="0.8" /><ellipse cx="0" cy="0" rx="38" ry="14" fill="none" stroke="#38BDF8" stroke-width="2" transform="rotate(-30)" /><circle cx="0" cy="0" r="8" fill="#FFFFFF" /></g>
      </g>

      <!-- Project Name -->
      <text x="35" y="230" font-size="20" font-weight="900" fill="#0F172A" letter-spacing="-0.5">SIH InThack</text>
      <text x="35" y="250" font-size="11" font-weight="800" fill="#38BDF8" class="mono">NATIONAL HACKATHON INTELLIGENCE PLATFORM</text>

      <!-- Description -->
      <text x="35" y="280" font-size="12" fill="#475569">
        <tspan x="35" dy="0">Full-stack AI platform built for Smart</tspan><tspan x="35" dy="18">India Hackathon '25 with automated</tspan><tspan x="35" dy="18">judging, team tracking, and smart</tspan>
      </text>

      <!-- Tech Stack Badges -->
      <g transform="translate(35, 350)">
        
        <rect x="0" y="0" width="90" height="20" rx="4" fill="#0F172A" opacity="1" stroke="#334155" stroke-width="1" />
        <text x="45" y="14" font-size="9.5" font-weight="700" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, monospace">Python</text>
        
        <rect x="96" y="0" width="90" height="20" rx="4" fill="#0F172A" opacity="1" stroke="#334155" stroke-width="1" />
        <text x="141" y="14" font-size="9.5" font-weight="700" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, monospace">FastAPI</text>
        
        <rect x="192" y="0" width="90" height="20" rx="4" fill="#0F172A" opacity="1" stroke="#334155" stroke-width="1" />
        <text x="237" y="14" font-size="9.5" font-weight="700" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, monospace">React</text>
        
        <rect x="0" y="26" width="90" height="20" rx="4" fill="#0F172A" opacity="1" stroke="#334155" stroke-width="1" />
        <text x="45" y="40" font-size="9.5" font-weight="700" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, monospace">PostgreSQL</text>
        
        <rect x="96" y="26" width="90" height="20" rx="4" fill="#0F172A" opacity="1" stroke="#334155" stroke-width="1" />
        <text x="141" y="40" font-size="9.5" font-weight="700" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, monospace">Docker</text>
        
        <rect x="192" y="26" width="90" height="20" rx="4" fill="#0F172A" opacity="1" stroke="#334155" stroke-width="1" />
        <text x="237" y="40" font-size="9.5" font-weight="700" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, monospace">Gemini AI</text>
        
      </g>

      <!-- Direct Repo Link Button -->
      <g transform="translate(35, 435)">
        <rect x="0" y="0" width="290" height="38" rx="8" fill="#38BDF8" opacity="0.2" stroke="#38BDF8" stroke-width="1.2" />
        <text x="145" y="24" font-size="12" font-weight="800" text-anchor="middle" fill="#38BDF8" class="mono">VIEW ON GITHUB ↗</text>
      </g>

      <!-- Shimmer sweep -->
      <rect x="10" y="10" width="340" height="500" rx="18" fill="url(#sheen-sih-inthack)" class="sheen-layer" pointer-events="none" />
    </a>
  </g>
</svg>